<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRWSHT ELITE</title>
<style>
:root {
  --bg:#260006;
  --burgundy:#3a0009;
  --burgundy-2:#52000e;
  --gold:#d9ad55;
  --gold-bright:#f0cc79;
  --cream:#f6e8c8;
  --muted:#d8bd87;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#140002;color:var(--cream);font-family:Tahoma,Arial,sans-serif}
body{display:flex;justify-content:center}
.page{
  width:min(100%,941px);min-height:100vh;
  background:
    radial-gradient(circle at 50% 70%,rgba(106,10,20,.35),transparent 36%),
    linear-gradient(180deg,#45000c 0%,#250006 55%,#170003 100%);
  overflow:hidden;position:relative;
}
.hero{
  height:min(65vw,760px);min-height:520px;max-height:760px;
  background:
    linear-gradient(180deg,rgba(45,0,8,0) 0%,rgba(45,0,8,0) 70%,#320008 100%),
    url("plng.jpeg") center 8%/cover no-repeat;
  position:relative;
}
/* Burgundy fade hides the generated poster's lower UI; the website UI below is real code. */
.hero:after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:31%;
  background:linear-gradient(180deg,rgba(50,0,8,0),#320008 58%,#2a0007 100%);
}
.content{position:relative;margin-top:-18px;padding:0 9% 70px;text-align:center}
.brand{font-family:Georgia,"Times New Roman",serif;color:var(--gold-bright);text-shadow:0 2px 9px #000}
.crown{font-size:27px;line-height:1;margin-bottom:-7px}
.brand-name{font-size:clamp(44px,8vw,72px);letter-spacing:.12em;line-height:1;margin:0;font-weight:500}
.elite-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:7px auto 20px;color:var(--gold);font-family:Georgia,serif;letter-spacing:.55em;font-size:18px}
.elite-row:before,.elite-row:after{content:"";height:1px;width:68px;background:linear-gradient(90deg,transparent,var(--gold))}
.elite-row:after{background:linear-gradient(90deg,var(--gold),transparent)}
.quote{font-size:clamp(16px,3vw,23px);line-height:2;color:#edcf91;margin:0 auto 22px;max-width:720px}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 24px}
.divider:before,.divider:after{content:"";height:1px;width:115px;background:linear-gradient(90deg,transparent,rgba(217,173,85,.7))}
.divider:after{background:linear-gradient(90deg,rgba(217,173,85,.7),transparent)}
.diamond{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.links{display:grid;gap:18px;max-width:650px;margin:0 auto;direction:ltr}
.social{
  min-height:82px;border-radius:999px;border:2px solid var(--gold);
  display:grid;grid-template-columns:90px 1px 1fr 50px;align-items:center;
  padding:0 20px 0 13px;text-decoration:none;color:var(--cream);
  background:linear-gradient(180deg,rgba(93,5,18,.82),rgba(43,0,8,.92));
  box-shadow:0 0 12px rgba(218,168,70,.34),inset 0 1px 0 rgba(255,237,187,.24);
  transition:.2s ease;
}
.social:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(218,168,70,.48)}
.icon{font-size:38px;color:var(--gold-bright);font-family:Arial,sans-serif;font-weight:700}
.sep{height:46px;background:rgba(240,204,121,.6)}
.handle{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,4vw,29px);letter-spacing:.02em;color:#f4dfb0}
.arrow{font-size:44px;color:var(--gold-bright);font-family:Arial;font-weight:200}
@media(max-width:600px){
  .hero{height:62vh;min-height:470px;background-position:center top}
  .content{padding-left:7%;padding-right:7%;padding-bottom:42px}
  .brand-name{font-size:44px}
  .elite-row{font-size:14px;gap:9px}
  .elite-row:before,.elite-row:after{width:45px}
  .quote{font-size:16px;line-height:1.9}
  .social{min-height:68px;grid-template-columns:66px 1px 1fr 36px;padding-right:14px}
  .icon{font-size:29px} .handle{font-size:19px} .arrow{font-size:32px} .sep{height:38px}
}

.brand-logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 18px}
.brand-logo{
  width:min(310px,72vw);
  height:auto;
  display:block;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 10px 32px rgba(0,0,0,.28);
}
.social-png{
  width:50px;
  height:50px;
  object-fit:contain;
  display:block;
}
@media(max-width:600px){
  .brand-logo{width:min(250px,68vw)}
  .social-png{width:50px;height:50px}
}

</style>
</head>
<body>
<main class="page">
  <section class="hero" aria-label="Leopard hero image"></section>

  <section class="content">
    <div class="brand brand-logo-wrap">
      <img class="brand-logo" src="logo.jpeg" alt="SRWSHT ELITE logo">
    </div>

    <p class="quote">« پێویست ناکات هاوار بکەیت بۆوەی بتبینن، تەنها ڕێک بپۆشە »</p>

    <div class="divider"><span class="diamond"></span></div>

    <div class="links">
      <a class="social" href="https://www.instagram.com/srusht.elite/" target="_blank" rel="noopener">
        <span class="icon"><img class="social-png" src="instagram.png" alt="Instagram"></span><span class="sep"></span><span class="handle">@srusht.elite</span><span class="arrow">›</span>
      </a>
      <a class="social" href="https://www.tiktok.com/@srwsht.elite" target="_blank" rel="noopener">
        <span class="icon"><img class="social-png" src="tiktok-logo-4514_256.png" alt="TikTok"></span><span class="sep"></span><span class="handle">@srwsht.elite</span><span class="arrow">›</span>
      </a>
    </div>
  </section>
</main>
</body>
</html>
